name: security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Install security scanners
        run: python -m pip install "pip-audit==2.9.0" "bandit==1.8.6"
      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Static security analysis
        run: bandit -q -r bot -ll -iii
