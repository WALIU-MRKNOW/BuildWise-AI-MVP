name: security

on:
  pull_request:
  push:
    branches:
      - main
      - "security/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Install security scanners
        run: python -m pip install "pip-audit==2.9.0" "bandit==1.8.6"
      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Static security analysis
        run: bandit -q -r bot -ll -iii
