name: pro-tests

on:
  push:
    branches:
      - main
      - "security/**"
      - build/buildwise-pro-report-mvp
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: buildwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-disposable
      PGDATABASE: buildwise_test
      BUILDWISE_DISPOSABLE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply actual database migrations to disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f migrations/001_buildwise_mvp.sql
          psql -v ON_ERROR_STOP=1 -f migrations/010_student_tools.sql
          psql -v ON_ERROR_STOP=1 -f migrations/011_ai_spend_budget.sql
          psql -v ON_ERROR_STOP=1 -f migrations/012_paystack_sandbox_ledger.sql
      - name: Verify transactions, permissions and concurrency
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/student_tools_smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/payment_smoke.sql
          python tests/sql/check_concurrency.py
